{% extends "verse/shell.html" %}
{% block title %}Create an account — LibraVerse{% endblock %}
{% block main %}
<div class="wrap section-space narrow">
  <p class="eyebrow"><span></span> Reader accounts</p><h1>Join LibraVerse</h1>
  <form method="post" class="surface stacked">
    {% csrf_token %}{{ form.as_p }}
    <label>Choose a public library<select name="library"><option value="">Choose later</option>{% for library in libraries %}<option value="{{ library.code }}"{% if selected_library == library.code %} selected{% endif %}>{{ library.name }}</option>{% endfor %}</select></label>
    <button class="button forest">Create my account</button>
  </form>
  <p>Already registered? <a class="text-link" href="{% url 'adminlogin' %}">Sign in</a></p>
</div>
{% endblock %}
