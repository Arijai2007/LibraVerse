{% extends "verse/shell.html" %}
{% block title %}Set a password — LibraVerse{% endblock %}
{% block main %}
<div class="wrap narrow section-space"><h1>Set a new password</h1>
  <p>Choose a personal password to activate access to {{ membership.library.name }}.</p>
  <form class="surface stacked" method="post">{% csrf_token %}
    <label>New password<input type="password" name="new_password" autocomplete="new-password" required></label>
    <label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" required></label>
    <button class="button forest">Save password</button>
  </form>
  <form method="post" action="{% url 'logout' %}" class="stacked">{% csrf_token %}<button class="button outline">Sign out</button></form>
</div>
{% endblock %}
